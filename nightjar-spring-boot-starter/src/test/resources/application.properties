spring.datasource.url=jdbc:h2:mem:starter-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.sql.init.mode=always
nightjar.domain-event.poll-interval=50ms
# liquibase-core is on the classpath for nightjar's migrator — Boot's own
# Liquibase integration is a different mechanism and stays off
spring.liquibase.enabled=false
